plugins {
    id 'com.android.application'
}

def externalBuildRoot = System.getenv('JUSTPROXY_BUILD_ROOT')
if (externalBuildRoot != null && !externalBuildRoot.trim().isEmpty()) {
    layout.buildDirectory = file("${externalBuildRoot}/app")
}

android {
    namespace 'com.justproxy.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.justproxy.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
