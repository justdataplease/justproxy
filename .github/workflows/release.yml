name: Build beta release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned Rust and Android native toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add --toolchain 1.85.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Test native gateway
        working-directory: native/wireguard-gateway
        run: cargo test --locked
      - run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk JustProxy-android-debug.apk
      - name: Verify APK packaging
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          badging="$($build_tools/aapt dump badging JustProxy-android-debug.apk)"
          native_code="$(printf '%s\n' "$badging" | grep -F "native-code:")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -Fq "'$abi'" <<< "$native_code"
          done
          "$build_tools/zipalign" -c -P 16 -v 4 JustProxy-android-debug.apk
          "$build_tools/apksigner" verify --verbose JustProxy-android-debug.apk
          apk_entries="$(unzip -Z1 JustProxy-android-debug.apk)"
          if grep -Fq 'libboringtun-' <<< "$apk_entries"; then
            echo "Unexpected standalone BoringTun library in APK" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: JustProxy-android-debug.apk

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s python/tests -v
      - run: python -m pip install build twine
      - run: python -m build --outdir ../python-release .
        working-directory: python
      - name: Check and smoke-test Python package
        run: |
          python -m twine check python-release/*
          python -m venv python-smoke
          python-smoke/bin/python -m pip install --no-index python-release/*.whl
          python-smoke/bin/python -c "from justproxy_client import JustProxyClient; assert JustProxyClient('token', proxy_username='user').requests_proxies(proxy_port=8282)['https'].startswith('http://user:token@')"
          python-smoke/bin/justproxy --version
      - uses: actions/upload-artifact@v7
        with:
          name: python-release
          path: python-release/*

  publish:
    needs: [android, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: JustProxy ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
