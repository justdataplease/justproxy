name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk JustProxy-android-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: JustProxy-android-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s desktop/tests -v
      - run: python -m pip install "pyinstaller>=6,<7"
      - name: Build executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean JustProxyDesktop.spec
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\desktop\dist\JustProxyDesktop.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Desktop self-test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: desktop/dist/JustProxyDesktop.exe

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s python/tests -v
      - run: python -m pip install build twine
      - run: python -m build --outdir ../python-release .
        working-directory: python
      - name: Check and smoke-test Python package
        run: |
          python -m twine check python-release/*
          python -m venv python-smoke
          python-smoke/bin/python -m pip install --no-index python-release/*.whl
          python-smoke/bin/python -c "from justproxy_client import JustProxyClient; assert JustProxyClient('token', proxy_username='user').requests_proxies(proxy_port=8282)['https'].startswith('http://user:token@')"
          python-smoke/bin/justproxy --version
      - uses: actions/upload-artifact@v7
        with:
          name: python-release
          path: python-release/*

  publish:
    needs: [android, windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: JustProxy ${{ inputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
